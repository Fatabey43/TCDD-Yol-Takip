<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Silver Gradients -->
    <linearGradient id="silverOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    
    <linearGradient id="silverInnerBezel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="railMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Deep Navy Enamel Background -->
    <radialGradient id="navyEnamel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14345c" />
      <stop offset="60%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#061324" />
    </radialGradient>

    <!-- Red Pin Gradient -->
    <linearGradient id="redPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="innerEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Text Paths for circular text -->
    <!-- Top Arc Path: left to right over top -->
    <path id="topTextArc" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />
    <!-- Bottom Arc Path: left to right under bottom -->
    <path id="bottomTextArc" d="M 105,250 A 155,155 0 0,0 395,250" fill="none" />
  </defs>

  <!-- Outer Shadow Layer -->
  <circle cx="250" cy="250" r="236" fill="#000000" opacity="0.15" filter="url(#badgeShadow)" />

  <!-- Outer Silver Metal Bezel (Chunky Enamel Coin Ring) -->
  <circle cx="250" cy="250" r="236" fill="url(#silverOuterRing)" stroke="#475569" stroke-width="2" />
  
  <!-- Silver Ridge Rim -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Inner Navy Blue Enamel Dial -->
  <circle cx="250" cy="250" r="220" fill="url(#navyEnamel)" stroke="url(#silverInnerBezel)" stroke-width="4" />

  <!-- Subtle Circular Groove Behind Text -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#020617" stroke-width="1.5" opacity="0.5" />

  <!-- Curved Text: TCDD TAKİP (Top Arc) -->
  <text fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="9" filter="url(#innerEmboss)">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      TCDD TAKİP
    </textPath>
  </text>

  <!-- Curved Text: 712 KISIM ŞEFLİĞİ (Bottom Arc) -->
  <text fill="#cbd5e1" stroke="#475569" stroke-width="0.6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="4" filter="url(#innerEmboss)">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      712 KISIM ŞEFLİĞİ
    </textPath>
  </text>

  <!-- Central Emblem Group: Railway Tracks & Ties -->
  <g id="railwayTracks">
    <!-- Center Dark Tunnel/Perspective V-Backdrop -->
    <polygon points="250,190 120,400 380,400" fill="#040c18" opacity="0.85" />

    <!-- Railway Sleepers (Horizontal Ties with metallic luster) -->
    <!-- Tie 1 (Top / furthest) -->
    <polygon points="236,220 264,220 267,227 233,227" fill="url(#railMetallic)" stroke="#334155" stroke-width="1" />
    <!-- Tie 2 -->
    <polygon points="228,236 272,236 276,244 224,244" fill="url(#railMetallic)" stroke="#334155" stroke-width="1" />
    <!-- Tie 3 -->
    <polygon points="219,254 281,254 286,263 214,263" fill="url(#railMetallic)" stroke="#334155" stroke-width="1" />
    <!-- Tie 4 -->
    <polygon points="208,275 292,275 298,285 202,285" fill="url(#railMetallic)" stroke="#334155" stroke-width="1.2" />
    <!-- Tie 5 -->
    <polygon points="196,298 304,298 311,310 189,310" fill="url(#railMetallic)" stroke="#334155" stroke-width="1.2" />
    <!-- Tie 6 -->
    <polygon points="182,324 318,324 326,338 174,338" fill="url(#railMetallic)" stroke="#334155" stroke-width="1.4" />
    <!-- Tie 7 -->
    <polygon points="166,354 334,354 343,370 157,370" fill="url(#railMetallic)" stroke="#334155" stroke-width="1.5" />
    <!-- Tie 8 (Bottom / closest) -->
    <polygon points="148,388 352,388 362,406 138,406" fill="url(#railMetallic)" stroke="#334155" stroke-width="1.6" />

    <!-- Left Steel Rail -->
    <polygon points="244,185 251,185 146,412 124,402" fill="url(#railMetallic)" stroke="#ffffff" stroke-width="1.5" filter="url(#innerEmboss)" />
    <polygon points="247,185 251,185 146,412 138,412" fill="#e2e8f0" />

    <!-- Right Steel Rail -->
    <polygon points="249,185 256,185 376,402 354,412" fill="url(#railMetallic)" stroke="#ffffff" stroke-width="1.5" filter="url(#innerEmboss)" />
    <polygon points="249,185 253,185 354,412 362,412" fill="#cbd5e1" />
  </g>

  <!-- Red Location Pin Marker (Upper Center) -->
  <g id="locationPin" filter="url(#badgeShadow)">
    <!-- Pin Outer White/Silver Metal Rim -->
    <path d="M 250,90 C 215,90 190,118 190,154 C 190,188 238,242 250,254 C 262,242 310,188 310,154 C 310,118 285,90 250,90 Z" 
          fill="url(#silverOuterRing)" stroke="#1e293b" stroke-width="2.5" />
    
    <!-- Pin Inner Red Enamel Fill -->
    <path d="M 250,98 C 220,98 198,122 198,154 C 198,182 240,230 250,242 C 260,230 302,182 302,154 C 302,122 280,98 250,98 Z" 
          fill="url(#redPinGrad)" stroke="#7f1d1d" stroke-width="1.5" />

    <!-- Pin Inner Highlight Arc -->
    <path d="M 210,140 C 210,118 226,104 250,104" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Front Face Locomotive / Train Icon (Pure White) -->
    <g transform="translate(222, 116) scale(1.4)" fill="#ffffff" stroke="#ffffff" stroke-width="0.5">
      <!-- Train Roof Lights -->
      <circle cx="14" cy="9" r="1.5" fill="#ffffff" />
      <circle cx="26" cy="9" r="1.5" fill="#ffffff" />

      <!-- Train Main Body -->
      <path d="M 12,12 C 12,10 14,9 20,9 C 26,9 28,10 28,12 L 28,26 C 28,29 26,30 20,30 C 14,30 12,29 12,26 Z" fill="#ffffff" />
      
      <!-- Windshield Windows (Cutout / Dark Red) -->
      <rect x="14.5" y="13" width="11" height="5.5" rx="1.5" fill="#991b1b" />
      
      <!-- Center Headlight / Grill -->
      <circle cx="20" cy="22" r="2.2" fill="#991b1b" />
      <circle cx="20" cy="22" r="1.2" fill="#ffffff" />
      
      <!-- Lower Cowcatcher / Front Buffers -->
      <rect x="14" y="26.5" width="12" height="1.8" rx="0.8" fill="#991b1b" />
      
      <!-- Lower Wheels / Tracks Base -->
      <line x1="14" y1="30" x2="12" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="26" y1="30" x2="28" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="10" y1="34" x2="30" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Glass Enamel Dome Highlight Overlay (Top Arc) -->
  <path d="M 60,200 A 216,216 0 0,1 440,200 A 216,140 0 0,0 60,200 Z" fill="#ffffff" opacity="0.08" pointer-events="none" />
</svg>
